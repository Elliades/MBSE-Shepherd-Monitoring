<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 240 240">
  <!-- UAV operator, drawn as a shepherd: hat, beard, green coat, crook, tablet to fly the drone -->
  <ellipse cx="116" cy="216" rx="70" ry="9" fill="#000" opacity=".14"/>
  <!-- crook -->
  <path d="M170 210V72a15 15 0 0 1 30 0" fill="none" stroke="#8a5a33" stroke-width="7" stroke-linecap="round"/>
  <!-- legs and boots -->
  <rect x="94" y="146" width="22" height="58" rx="6" fill="#5b4636"/>
  <rect x="120" y="146" width="22" height="58" rx="6" fill="#4d3a2c"/>
  <path d="M88 202h30v10H86a4 4 0 0 1-4-5z" fill="#2b2f33"/>
  <path d="M120 202h30l4 5a4 4 0 0 1-4 5h-30z" fill="#2b2f33"/>
  <!-- coat -->
  <path d="M80 96q32-18 64 0l12 62H68z" fill="#6d8b4f"/>
  <path d="M112 90v68" stroke="#587240" stroke-width="3"/>
  <rect x="72" y="126" width="80" height="7" fill="#4a3a2a"/>
  <rect x="106" y="124" width="12" height="11" rx="2" fill="#d9a441"/>
  <!-- scarf -->
  <ellipse cx="112" cy="92" rx="20" ry="7" fill="#c0392b"/>
  <!-- arms and hands -->
  <path d="M86 100L88 132" stroke="#6d8b4f" stroke-width="15" stroke-linecap="round"/>
  <path d="M142 100L166 128" stroke="#6d8b4f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="170" cy="130" r="8" fill="#f0c39b"/>
  <g transform="rotate(-8 98 134)">
    <rect x="80" y="122" width="34" height="24" rx="4" fill="#2b2f33"/>
    <rect x="84" y="126" width="26" height="16" rx="2" fill="#7fc4e0"/>
    <path d="M88 138l6-6 5 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="88" cy="140" r="8" fill="#f0c39b"/>
  <!-- head -->
  <circle cx="112" cy="64" r="21" fill="#f0c39b"/>
  <path d="M93 68Q112 100 131 68Q112 82 93 68Z" fill="#9a7b57"/>
  <circle cx="104" cy="62" r="2.6" fill="#3a2a1a"/><circle cx="120" cy="62" r="2.6" fill="#3a2a1a"/>
  <!-- hat -->
  <ellipse cx="112" cy="50" rx="36" ry="8" fill="#b08850"/>
  <path d="M93 50Q93 26 112 26Q131 26 131 50Z" fill="#c9a064"/>
  <rect x="93" y="43" width="38" height="7" fill="#5b4636"/>
</svg>
