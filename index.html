<body>

<header class="top">
  <div class="top-row">
    <button class="brand" data-action="home" aria-label="Back to the first scene">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="3.2"/><circle cx="17.5" cy="6.5" r="3.2"/><circle cx="6.5" cy="17.5" r="3.2"/><circle cx="17.5" cy="17.5" r="3.2"/></g></svg>
    </button>
    <div class="crumb" aria-live="polite">
      <span class="crumb-code" id="crumb-code"></span>
      <span class="crumb-title" id="crumb-title"></span>
      <span class="crumb-count" id="crumb-count"></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="sim-btn" aria-expanded="false" aria-controls="sim-drawer" aria-label="Show or hide the drone simulation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="6" height="6" rx="1.2"/><circle cx="5.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <span class="txt">Simulation</span><i class="news" aria-hidden="true"></i>
      </button>
      <button class="icon-btn" id="cameo-btn" data-status="off" aria-label="Connect to Cameo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span class="txt">Cameo</span><i class="dot"></i>
      </button>
      <button class="icon-btn" data-action="faq" aria-label="Frequently asked questions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 4"/><path d="M12 17.4v.1"/></svg>
        <span class="txt">FAQ</span>
      </button>
      <button class="icon-btn" data-action="toc" aria-label="Open the flight plan (all scenes)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h7a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h7"/></svg>
        <span class="txt">Flight plan</span>
      </button>
    </div>
  </div>
  <button class="route" id="route" data-action="toc" aria-label="Progress. Open the flight plan."></button>
</header>

<main id="stage" tabindex="-1"></main>

<nav class="dock" aria-label="Scene navigation">
  <div class="dock-inner">
    <button class="btn ghost dock-back" data-action="back" aria-label="Previous scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="txt">Back</span>
    </button>
    <div class="dock-info" id="dock-info"></div>
    <button class="btn dock-next" data-action="next">
      <span class="lbl"><span id="next-label">Next</span><small id="next-title"></small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</nav>

<div id="overlay-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
