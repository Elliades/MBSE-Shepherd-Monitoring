<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1f2937" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="190" y="24" width="370" height="372" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="206" y="48" font-size="15" font-weight="600" fill="#334155">Ride-hailing app (Uber)</text>

  <!-- Actor -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="80" cy="120" r="14"/>
    <line x1="80" y1="134" x2="80" y2="178"/>
    <line x1="54" y1="150" x2="106" y2="150"/>
    <line x1="80" y1="178" x2="58" y2="212"/>
    <line x1="80" y1="178" x2="102" y2="212"/>
  </g>
  <text x="80" y="236" font-size="15" text-anchor="middle" fill="#1f2937">Passenger</text>

  <!-- Association -->
  <line x1="110" y1="150" x2="250" y2="140" stroke="#1f2937" stroke-width="1.6"/>

  <!-- Base use case, with its extension point compartment -->
  <ellipse cx="375" cy="140" rx="128" ry="66" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="375" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">Transport passenger</text>
  <text x="375" y="131" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">from A to B</text>
  <line x1="255" y1="146" x2="495" y2="146" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="375" y="165" font-size="12" font-style="italic" text-anchor="middle" fill="#334155">extension points</text>
  <text x="375" y="183" font-size="13" text-anchor="middle" fill="#b45309" font-weight="600">Passenger needs assistance</text>

  <!-- Extension use case -->
  <ellipse cx="375" cy="320" rx="128" ry="50" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="375" y="315" font-size="15" font-weight="600" text-anchor="middle" fill="#78350f">Transport a</text>
  <text x="375" y="334" font-size="15" font-weight="600" text-anchor="middle" fill="#78350f">disabled person</text>

  <!-- Extend: from the extension to the base -->
  <line x1="375" y1="270" x2="375" y2="209" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/>
  <text x="385" y="245" font-size="14" fill="#1f2937">«extend»</text>

  <!-- Note: condition and extension point -->
  <line x1="375" y1="222" x2="580" y2="222" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 4"/>
  <path d="M580 196 H790 V272 L778 284 H580 Z" fill="#fffbeb" stroke="#64748b" stroke-width="1.4"/>
  <path d="M790 272 H778 V284" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <text x="592" y="218" font-size="13" font-weight="600" fill="#1f2937">Condition:</text>
  <text x="592" y="236" font-size="13" fill="#1f2937">{wheelchair requested}</text>
  <text x="592" y="257" font-size="13" font-weight="600" fill="#1f2937">Extension point:</text>
  <text x="592" y="275" font-size="13" fill="#b45309">Passenger needs assistance</text>
</svg>
