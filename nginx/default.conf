server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/health {
    alias /usr/share/nginx/html/api/health.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # The relay between Cameo and the guides: wss://<this host>/relay/v1/plugin and /relay/v1/room/<code>.
  # The address is looked up at each request, so the web service still starts when the relay is down.
  location /relay/ {
    resolver 127.0.0.11 valid=10s;
    set $relay http://relay:8787;
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass $relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # The browser asks again at each visit, so a deploy shows up without a hard refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
